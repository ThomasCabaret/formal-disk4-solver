[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-disk4-solver"
version = "1.9.2"
description = "Incremental formal contour solver prototype for congruent pieces tiling a disk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "scipy>=1.11",
]

[project.optional-dependencies]
graph-lab = [
  "torch>=2.2",
]

[project.scripts]
formal-disk4 = "formal_disk4.cli:main"
formal-contour = "formal_disk4.cli:main"
formal-disk4-gui = "formal_disk4.orchestration.gui:main"
formal-disk4-mapping-lab = "formal_disk4.mapping_lab.cli:main"
formal-disk4-mapping-dashboard = "formal_disk4.mapping_lab.dashboard:main"
formal-disk4-graph-lab = "formal_disk4.graph_lab.cli:main"
formal-disk4-graph-coverage = "formal_disk4.graph_lab.coverage:main"
formal-disk4-graph-dashboard = "formal_disk4.graph_lab.dashboard:main"
formal-disk4-rollout-audit = "formal_disk4.graph_lab.rollout_audit:main"
formal-disk4-lab = "formal_disk4.graph_lab.app:main"
formal-disk4-geometry-recovery-benchmark = "formal_disk4.geometry.recovery_benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
